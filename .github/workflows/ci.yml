name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/specx/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/specx/hooks/hooks.json > /dev/null
      - name: Guard hook works
        run: python3 plugins/specx/hooks/guard_test.py
      - name: Skills have frontmatter and no unfilled placeholders
        run: |
          for skill in explore plan execute review; do
            f=plugins/specx/skills/$skill/SKILL.md
            head -1 "$f" | grep -qx -- '---'
            grep -qx "name: $skill" "$f"
            grep -q '^description: ' "$f"
            if grep -q '{{SKILL_NAME}}\|{{RULES}}' "$f"; then exit 1; fi
          done
      - name: Rules in this repository match the plugin template
        run: |
          diff -u plugins/specx/templates/RULES.md specx/RULES.md
          python3 - <<'PY'
          import re
          rules = open("plugins/specx/templates/RULES.md").read().strip()
          for name in ("CLAUDE.md", "AGENTS.md"):
              text = open(name).read()
              m = re.search(r"<!-- specx:rules:begin -->\n(.*?)\n<!-- specx:rules:end -->", text, re.S)
              assert m and m.group(1).strip() == rules, f"{name} rules differ from plugin template"
          PY
